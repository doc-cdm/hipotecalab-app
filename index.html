    <!-- CSS crítico inline para above-the-fold -->
    <style>
      /* CSS crítico para evitar bloqueo de renderizado */
      body {
        margin: 0;
        background-color: #0f172a;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .focus\:not-sr-only:focus {
        position: static;
        width: auto;
        height: auto;
        padding: 0.5rem 1rem;
        margin: inherit;
        overflow: visible;
        clip: auto;
        white-space: normal;
        background-color: #f97316;
        color: white;
        border-radius: 0.375rem;
        text-decoration: none;
        z-index: 50;
      }
      /* Estilos de loading inicial */
      .initial-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0f172a;
      }
      .loading-spinner {
        width: 2rem;
        height: 2rem;
        border: 4px solid #f97316;
        border-top: 4px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading inicial mientras carga React - Removido temporalmente -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" defer></script>
    
    <!-- PWA Service Worker Registration - Diferido para no bloquear -->
    <script>
      // Diferir el registro del SW hasta después del load inicial
      window.addEventListener('load', () => {
        // Usar requestIdleCallback para registrar SW en tiempo idle
        if ('requestIdleCallback' in window) {
          // @ts-ignore
          requestIdleCallback(registerSW);
        } else {
          // Fallback para navegadores sin requestIdleCallback
          setTimeout(registerSW, 1000);
        }
      });
      
      function registerSW() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('✅ Service Worker registrado:', registration.scope);
              
              // Listener para actualizaciones
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Nueva versión disponible
                    console.log('🔄 Nueva versión de la app disponible');
                    if (confirm('Hay una nueva versión disponible. ¿Deseas actualizarla?')) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                      window.location.reload();
                    }
                  }
                });
              });
            })
            .catch(error => {
              console.error('❌ Error al registrar Service Worker:', error);
            });
          
          // Listener para cuando el SW toma control
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('🔄 Service Worker actualizado, recargando...');
            window.location.reload();
          });
        }
      }
      
      // Detectar si se está ejecutando como PWA - También diferido
      window.addEventListener('load', () => {
        requestAnimationFrame(() => {
          if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
            console.log('📱 Ejecutándose como PWA');
            document.documentElement.classList.add('pwa-mode');
          }
          
          // Prevenir zoom en iOS - Solo después del load
          document.addEventListener('touchstart', (event) => {
            if (event.touches.length > 1) {
              event.preventDefault();
            }
          }, { passive: false });
          
          let lastTouchEnd = 0;
          document.addEventListener('touchend', (event) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
              event.preventDefault();
            }
            lastTouchEnd = now;
          }, false);
        });
      });
    </script>
  </body>
