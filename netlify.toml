[build]
  # Directorio donde se ejecutará el build
  publish = "dist"
  
  # Comando para construir la aplicación
  command = "npm run build"

[build.environment]
  # Versión de Node.js a usar
  NODE_VERSION = "18"
  
# Build optimizations para mejorar performance
[build.processing]
  skip_processing = false
  
[build.processing.css]
  bundle = true
  minify = true
  
[build.processing.js]
  bundle = true
  minify = true

# Redirects para SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad y performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "cross-origin"
    # CSP actualizada para Google Auth con todos los dominios necesarios
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://www.googletagmanager.com https://apis.google.com https://accounts.google.com https://ssl.gstatic.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://www.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://www.gstatic.com https://ssl.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://apis.google.com https://accounts.google.com https://www.gstatic.com https://oauth2.googleapis.com https://*.firebaseapp.com; frame-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com https://content.googleapis.com https://*.firebaseapp.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com"

# Headers para archivos estáticos con cache agresivo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
# Headers para Service Worker (sin cache)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    
# Headers para manifest y iconos
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
